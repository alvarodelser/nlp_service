# nlp_service/config/topics.yaml
# Urban alternative-mobility taxonomy for BikesForCities, in the news-pipeline schema.
#
# SCOPE: articles about cycling infrastructure, active transport, pedestrianisation,
# shared micro-mobility, and related urban policy IN A CITY CONTEXT.
#
# This file is the ONLY place the news use case is described. The nlp modules are agnostic;
# the orchestrator (pipelines/news) reads this via NewsConfig and drives nli.score / nli.classify.

in_scope:                         # whitelist hypotheses — pass if ANY clears its threshold (OR)
  threshold: 0.40
  hypotheses:
    - "Este artículo trata sobre movilidad urbana alternativa: ciclismo en ciudad, bicicletas o patinetes."
    - "Este artículo trata sobre infraestructura para el transporte activo, como carriles bici o peatonalización."
    - "Este artículo trata sobre política o regulación de movilidad sostenible en una ciudad."

blacklist:                        # exclude if ANY clears its threshold (AND-exclusion)
  threshold: 0.70
  hypotheses:
    - "Este artículo trata sobre ciclismo deportivo, competición ciclista o carreras de bicicletas."
    - "Este artículo trata sobre senderismo, montañismo o deporte en la naturaleza sin relación con la movilidad urbana."
    - "Este artículo trata sobre un evento deportivo o competición atlética, sin relación con infraestructura urbana."

topics:                           # labels assigned to in-scope articles
  threshold: 0.50
  top_k: 3
  hypothesis_template: "Este artículo trata sobre {}."
  labels:
    - infraestructura ciclista
    - carril bici
    - aparcamiento de bicicletas
    - movilidad personal eléctrica
    - patinete eléctrico
    - bicicleta eléctrica
    - política de movilidad
    - regulación de movilidad
    - presupuesto municipal
    - zonas de bajas emisiones
    - peatonalización
    - urbanismo táctico
    - obras de movilidad
    - seguridad vial
    - accidente de tráfico
    - tráfico rodado
    - movilidad sostenible
    - transporte activo
    - contaminación urbana
    - opinión y debate

scope:                            # nested geographic scope
  threshold: 0.35
  place_template: "Este artículo trata principalmente sobre {}."
  level_hypotheses:               # pass 1 — mutually exclusive (nli.classify multi_label=False)
    city: >-
      Este artículo trata sobre movilidad en una ciudad o municipio concreto de España.
    regional: >-
      Este artículo trata sobre movilidad en una comunidad autónoma, provincia o región
      específica de España.
    national: >-
      Este artículo trata sobre una política, regulación o iniciativa de movilidad a nivel
      nacional en España, sin estar limitado a una ciudad o región específica.
